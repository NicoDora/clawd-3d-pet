<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clawd 3D 테마 미리보기</title>
<style>
  :root { --bg: #e9edf2; --card: #f7f9fb; --ink: #1f2933; --sub: #66727f; --line: #d5dce4; --accent: #de886d; }
  @media (prefers-color-scheme: dark) { :root { --bg: #171a1f; --card: #20252c; --ink: #eef1f4; --sub: #98a3af; --line: #2f3640; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 -apple-system, "Apple SD Gothic Neo", "Pretendard", system-ui, sans-serif; }
  main { max-width: 1180px; margin: 0 auto; padding: 28px 16px 56px; }
  h1 { font-size: 24px; margin: 0 0 4px; letter-spacing: -0.01em; }
  h1 span { color: var(--accent); }
  p.lead { margin: 0 0 22px; color: var(--sub); }
  h2 { font-size: 13px; font-weight: 600; color: var(--sub); margin: 26px 0 10px; letter-spacing: 0.02em; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 10px; }
  figure { margin: 0; background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; cursor: pointer; }
  .stage { position: relative; aspect-ratio: 1; overflow: hidden; }
  /* same box the app gives the art inside a square pet window */
  .stage img, .stage object { position: absolute; width: 130.5%; height: 130.5%; left: -15.25%; bottom: -3.7%; pointer-events: none; }
  .stage img { height: auto; }
  figcaption { padding: 7px 10px 9px; border-top: 1px solid var(--line); }
  figcaption b { display: block; font-weight: 600; font-size: 13px; }
  figcaption small { color: var(--sub); font-size: 11.5px; }
  .hint { color: var(--sub); font-size: 12.5px; margin-top: 26px; }
</style>
<main>
  <h1>Clawd <span>3D</span></h1>
  <p class="lead">기본 Clawd의 모든 상태·반응·미니 모드 애니메이션을 3D 리그로 새로 렌더한 커스텀 테마입니다. 카드를 누르면 그 애니메이션이 처음부터 다시 재생됩니다.</p>
  <div id="root"></div>
  <p class="hint">대기(커서 추적) 카드 위에서 마우스를 움직이면 앱에서처럼 눈과 몸이 커서를 따라갑니다.</p>
</main>
<script>
  const A = "../theme/clawd-3d/assets/clawd3d-";
  const GROUPS = [
    ["대기 · 수면", [
      ["idle-follow.svg", "대기 (커서 추적)", "idle"], ["idle-look.apng", "두리번", "idle 랜덤"], ["idle-bubble.apng", "비눗방울", "idle 랜덤"],
      ["idle-reading.apng", "독서", "idle 랜덤"], ["idle-yawn.apng", "하품", "yawning"], ["idle-doze.apng", "꾸벅꾸벅", "dozing"],
      ["collapse-sleep.apng", "쓰러져 잠듦", "collapsing"], ["sleeping.apng", "수면", "sleeping"], ["wake.apng", "기상", "waking"]]],
    ["작업", [
      ["working-thinking.apng", "생각 중", "thinking"], ["working-typing.apng", "타이핑", "working · 1세션"], ["headphones-groove.apng", "헤드폰 그루브", "working · 2세션 / 서브에이전트"],
      ["working-building.apng", "건설", "working · 3세션+"], ["working-juggling.apng", "저글링", "서브에이전트 2+"], ["working-sweeping.apng", "빗자루질", "sweeping · 컨텍스트 압축"],
      ["working-carrying.apng", "운반", "carrying · 워크트리"], ["working-debugger.apng", "디버거", "업데이트 확인"], ["designing.apng", "디자인", "claude-design 힌트"]]],
    ["알림 · 결과", [
      ["happy.apng", "완료!", "attention"], ["heart-eyes.apng", "하트 눈", "디자인 완료"], ["notification.apng", "알림", "notification"],
      ["error.apng", "오류", "error"], ["dizzy.apng", "어질어질", "dizzy"]]],
    ["클릭 · 드래그 반응", [
      ["react-drag.apng", "드래그", "drag"], ["react-left.apng", "왼쪽 콕", "clickLeft"], ["react-right.apng", "오른쪽 콕", "clickRight"],
      ["react-annoyed.apng", "짜증", "annoyed"], ["react-double.apng", "깜짝", "double"], ["react-double-jump.apng", "깜짝 점프", "double"], ["crabwalk.apng", "게걸음", "roam · mini-crabwalk"]]],
    ["미니 모드 (화면 오른쪽 가장자리)", [
      ["mini-idle.apng", "미니 대기", "mini-idle"], ["mini-peek.apng", "빼꼼", "mini-peek"], ["mini-alert.apng", "미니 알림", "mini-alert"],
      ["mini-happy.apng", "미니 완료", "mini-happy"], ["mini-typing.apng", "미니 작업", "mini-working"], ["mini-enter.apng", "미니 진입", "mini-enter"],
      ["mini-enter-sleep.apng", "잠든 채 진입", "mini-enter-sleep"], ["mini-sleep.apng", "미니 수면", "mini-sleep"], ["mini-sleep-left.apng", "미니 수면 (왼쪽 가장자리용)", "mirroredFiles"]]],
  ];
  const root = document.getElementById("root");
  for (const [title, items] of GROUPS) {
    const h = document.createElement("h2"); h.textContent = title; root.append(h);
    const grid = document.createElement("div"); grid.className = "grid"; root.append(grid);
    for (const [file, name, state] of items) {
      const fig = document.createElement("figure");
      const stage = document.createElement("div"); stage.className = "stage";
      const isSvg = file.endsWith(".svg");
      const el = document.createElement(isSvg ? "object" : "img");
      if (isSvg) { el.type = "image/svg+xml"; el.data = A + file; } else { el.src = A + file; el.alt = name; }
      stage.append(el);
      const cap = document.createElement("figcaption");
      const b = document.createElement("b"); b.textContent = name;
      const s = document.createElement("small"); s.textContent = state;
      cap.append(b, s); fig.append(stage, cap); grid.append(fig);
      if (isSvg) {
        // the same transforms the app applies for cursor tracking
        addEventListener("mousemove", (ev) => {
          const d = el.contentDocument; if (!d || !d.getElementById("eyes-js")) return;
          const r = stage.getBoundingClientRect(), rx = ev.clientX - (r.left + r.width * 0.5), ry = ev.clientY - (r.top + r.height * 0.72);
          const dist = Math.hypot(rx, ry) || 1, k = Math.min(1, dist / 300), M = 1.6;
          const q = (v) => Math.round(v * 2) / 2, c = (v, m) => Math.max(-m, Math.min(m, v));
          const dx = c(q(rx / dist * M * k), M * 0.85), dy = c(q(ry / dist * M * k), M * 0.5);
          const bx = q(dx * 0.33), by = q(dy * 0.33);
          d.getElementById("eyes-js").setAttribute("transform", `translate(${dx}, ${dy})`);
          d.getElementById("body-js").setAttribute("transform", `translate(${bx}, ${by})`);
          d.getElementById("shadow-js").setAttribute("transform", `translate(${q(bx * 0.3)}, 0) scale(${1 + Math.abs(bx) * 0.1}, 1)`);
        });
      } else {
        let n = 0;
        fig.addEventListener("click", () => { el.src = `${A}${file}?replay=${++n}`; });
      }
    }
  }
</script>
</html>
